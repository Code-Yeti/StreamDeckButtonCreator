const ANIM_PARAM_DEFAULTS = {

};

const EF = {
  linear: t => t,
  easeInOut: t => t < 0.5 ? 2*t*t : -1+(4-2*t)*t,
  easeOut: t => t*(2-t),
  easeIn: t => t*t,
  bounce: t => {
    if (t<1/2.75) return 7.5625*t*t;
    if (t<2/2.75) return 7.5625*(t-=1.5/2.75)*t+0.75;
    if (t<2.5/2.75) return 7.5625*(t-=2.25/2.75)*t+0.9375;
    return 7.5625*(t-=2.625/2.75)*t+0.984375;
  },
};

const EASING_OPTIONS = [

/* SVG Icon shape paths — all defined in a 100x100 viewBox, drawn with canvas transforms */
const SVG_ICONS = [
  { id:"arrow-right",    label:"→ Arrow Right",     cat:"Arrows",   draw:(ctx,x,y,w,h)=>{ const s=Math.min(w,h),cx=x+w/2,cy=y+h/2,sw=s*0.18,hw=s*0.5,hh=s*0.3; ctx.beginPath();ctx.moveTo(cx-hw/2,cy-sw/2);ctx.lineTo(cx+hw/2-hh*0.55,cy-sw/2);ctx.lineTo(cx+hw/2-hh*0.55,cy-hh/2);ctx.lineTo(cx+hw/2,cy);ctx.lineTo(cx+hw/2-hh*0.55,cy+hh/2);ctx.lineTo(cx+hw/2-hh*0.55,cy+sw/2);ctx.lineTo(cx-hw/2,cy+sw/2);ctx.closePath(); } },
  { id:"arrow-left",     label:"← Arrow Left",      cat:"Arrows",   draw:(ctx,x,y,w,h)=>{ const s=Math.min(w,h),cx=x+w/2,cy=y+h/2,sw=s*0.18,hw=s*0.5,hh=s*0.3; ctx.beginPath();ctx.moveTo(cx+hw/2,cy-sw/2);ctx.lineTo(cx-hw/2+hh*0.55,cy-sw/2);ctx.lineTo(cx-hw/2+hh*0.55,cy-hh/2);ctx.lineTo(cx-hw/2,cy);ctx.lineTo(cx-hw/2+hh*0.55,cy+hh/2);ctx.lineTo(cx-hw/2+hh*0.55,cy+sw/2);ctx.lineTo(cx+hw/2,cy+sw/2);ctx.closePath(); } },
  { id:"arrow-up",       label:"↑ Arrow Up",         cat:"Arrows",   draw:(ctx,x,y,w,h)=>{ const s=Math.min(w,h),cx=x+w/2,cy=y+h/2,sw=s*0.18,hh=s*0.5,hw=s*0.3; ctx.beginPath();ctx.moveTo(cx-sw/2,cy+hh/2);ctx.lineTo(cx-sw/2,cy-hh/2+hw*0.55);ctx.lineTo(cx-hw/2,cy-hh/2+hw*0.55);ctx.lineTo(cx,cy-hh/2);ctx.lineTo(cx+hw/2,cy-hh/2+hw*0.55);ctx.lineTo(cx+sw/2,cy-hh/2+hw*0.55);ctx.lineTo(cx+sw/2,cy+hh/2);ctx.closePath(); } },
  { id:"arrow-down",     label:"↓ Arrow Down",       cat:"Arrows",   draw:(ctx,x,y,w,h)=>{ const s=Math.min(w,h),cx=x+w/2,cy=y+h/2,sw=s*0.18,hh=s*0.5,hw=s*0.3; ctx.beginPath();ctx.moveTo(cx-sw/2,cy-hh/2);ctx.lineTo(cx-sw/2,cy+hh/2-hw*0.55);ctx.lineTo(cx-hw/2,cy+hh/2-hw*0.55);ctx.lineTo(cx,cy+hh/2);ctx.lineTo(cx+hw/2,cy+hh/2-hw*0.55);ctx.lineTo(cx+sw/2,cy+hh/2-hw*0.55);ctx.lineTo(cx+sw/2,cy-hh/2);ctx.closePath(); } },
  { id:"chevron-right",  label:"❯ Chevron Right",    cat:"Arrows",   draw:(ctx,x,y,w,h)=>{ const s=Math.min(w,h)*0.45,cx=x+w/2,cy=y+h/2,t=s*0.22; ctx.beginPath();ctx.moveTo(cx-s*0.4,cy-s);ctx.lineTo(cx+s*0.4,cy);ctx.lineTo(cx-s*0.4,cy+s);ctx.lineTo(cx-s*0.4+t*2,cy+s);ctx.lineTo(cx+s*0.4+t*2,cy);ctx.lineTo(cx-s*0.4+t*2,cy-s);ctx.closePath(); } },
  { id:"double-arrow",   label:"⇒ Double Arrow",     cat:"Arrows",   draw:(ctx,x,y,w,h)=>{ const s=Math.min(w,h),cx=x+w/2,cy=y+h/2,hw=s*0.22,hh=s*0.28,sw=s*0.14; ctx.beginPath();ctx.moveTo(cx-s*0.42,cy-sw/2);ctx.lineTo(cx-s*0.04,cy-sw/2);ctx.lineTo(cx-s*0.04,cy-hh/2);ctx.lineTo(cx+s*0.22,cy);ctx.lineTo(cx-s*0.04,cy+hh/2);ctx.lineTo(cx-s*0.04,cy+sw/2);ctx.lineTo(cx-s*0.42,cy+sw/2);ctx.lineTo(cx-s*0.42,cy+hh/2);ctx.lineTo(cx-s*0.22,cy);ctx.lineTo(cx-s*0.42,cy-hh/2);ctx.closePath(); } },
  { id:"play",           label:"▶ Play",              cat:"Media",    draw:(ctx,x,y,w,h)=>{ const s=Math.min(w,h)*0.45,cx=x+w/2,cy=y+h/2; ctx.beginPath();ctx.moveTo(cx-s*0.7,cy-s);ctx.lineTo(cx+s,cy);ctx.lineTo(cx-s*0.7,cy+s);ctx.closePath(); } },
  { id:"pause",          label:"⏸ Pause",             cat:"Media",    draw:(ctx,x,y,w,h)=>{ const s=Math.min(w,h)*0.42,cx=x+w/2,cy=y+h/2,bw=s*0.35,bh=s*1.8,gap=s*0.3; ctx.beginPath();ctx.rect(cx-gap/2-bw,cy-bh/2,bw,bh);ctx.rect(cx+gap/2,cy-bh/2,bw,bh); } },
  { id:"stop",           label:"⏹ Stop",              cat:"Media",    draw:(ctx,x,y,w,h)=>{ const s=Math.min(w,h)*0.42,cx=x+w/2,cy=y+h/2; ctx.beginPath();ctx.rect(cx-s,cy-s,s*2,s*2); } },
  { id:"skip-fwd",       label:"⏭ Skip Fwd",          cat:"Media",    draw:(ctx,x,y,w,h)=>{ const s=Math.min(w,h)*0.38,cx=x+w/2,cy=y+h/2,bw=s*0.18; ctx.beginPath();ctx.moveTo(cx-s,cy-s);ctx.lineTo(cx+s*0.2,cy);ctx.lineTo(cx-s,cy+s);ctx.closePath();ctx.moveTo(cx+s*0.2,cy-s);ctx.lineTo(cx+s*0.2+bw,cy-s);ctx.lineTo(cx+s*0.2+bw,cy+s);ctx.lineTo(cx+s*0.2,cy+s);ctx.closePath(); } },
  { id:"skip-back",      label:"⏮ Skip Back",         cat:"Media",    draw:(ctx,x,y,w,h)=>{ const s=Math.min(w,h)*0.38,cx=x+w/2,cy=y+h/2,bw=s*0.18; ctx.beginPath();ctx.moveTo(cx+s,cy-s);ctx.lineTo(cx-s*0.2,cy);ctx.lineTo(cx+s,cy+s);ctx.closePath();ctx.moveTo(cx-s*0.2,cy-s);ctx.lineTo(cx-s*0.2-bw,cy-s);ctx.lineTo(cx-s*0.2-bw,cy+s);ctx.lineTo(cx-s*0.2,cy+s);ctx.closePath(); } },
  { id:"record",         label:"⏺ Record",             cat:"Media",    draw:(ctx,x,y,w,h)=>{ const r=Math.min(w,h)*0.38,cx=x+w/2,cy=y+h/2; ctx.beginPath();ctx.arc(cx,cy,r,0,Math.PI*2); } },
  { id:"star",           label:"★ Star",               cat:"Shapes",   draw:(ctx,x,y,w,h)=>{ const r1=Math.min(w,h)*0.46,r2=r1*0.4,cx=x+w/2,cy=y+h/2,n=5; ctx.beginPath();for(let i=0;i<n*2;i++){const a=i*Math.PI/n-Math.PI/2,r=i%2===0?r1:r2;ctx.lineTo(cx+Math.cos(a)*r,cy+Math.sin(a)*r);}ctx.closePath(); } },
  { id:"star6",          label:"✦ 6-Star",             cat:"Shapes",   draw:(ctx,x,y,w,h)=>{ const r1=Math.min(w,h)*0.46,r2=r1*0.45,cx=x+w/2,cy=y+h/2,n=6; ctx.beginPath();for(let i=0;i<n*2;i++){const a=i*Math.PI/n-Math.PI/2,r=i%2===0?r1:r2;ctx.lineTo(cx+Math.cos(a)*r,cy+Math.sin(a)*r);}ctx.closePath(); } },
  { id:"diamond",        label:"◆ Diamond",            cat:"Shapes",   draw:(ctx,x,y,w,h)=>{ const s=Math.min(w,h)*0.46,cx=x+w/2,cy=y+h/2; ctx.beginPath();ctx.moveTo(cx,cy-s);ctx.lineTo(cx+s*0.65,cy);ctx.lineTo(cx,cy+s);ctx.lineTo(cx-s*0.65,cy);ctx.closePath(); } },
  { id:"triangle",       label:"▲ Triangle",           cat:"Shapes",   draw:(ctx,x,y,w,h)=>{ const s=Math.min(w,h)*0.48,cx=x+w/2,cy=y+h/2; ctx.beginPath();ctx.moveTo(cx,cy-s);ctx.lineTo(cx+s*0.9,cy+s*0.7);ctx.lineTo(cx-s*0.9,cy+s*0.7);ctx.closePath(); } },
  { id:"hexagon",        label:"⬡ Hexagon",            cat:"Shapes",   draw:(ctx,x,y,w,h)=>{ const r=Math.min(w,h)*0.46,cx=x+w/2,cy=y+h/2; ctx.beginPath();for(let i=0;i<6;i++){const a=i*Math.PI/3-Math.PI/6;ctx.lineTo(cx+Math.cos(a)*r,cy+Math.sin(a)*r);}ctx.closePath(); } },
  { id:"shield",         label:"🛡 Shield",             cat:"Shapes",   draw:(ctx,x,y,w,h)=>{ const s=Math.min(w,h)*0.46,cx=x+w/2,cy=y+h/2; ctx.beginPath();ctx.moveTo(cx-s,cy-s);ctx.lineTo(cx+s,cy-s);ctx.lineTo(cx+s,cy+s*0.1);ctx.quadraticCurveTo(cx+s,cy+s*0.8,cx,cy+s);ctx.quadraticCurveTo(cx-s,cy+s*0.8,cx-s,cy+s*0.1);ctx.closePath(); } },
  { id:"checkmark",      label:"✓ Checkmark",          cat:"Symbols",  draw:(ctx,x,y,w,h)=>{ const s=Math.min(w,h)*0.4,cx=x+w/2,cy=y+h/2; ctx.beginPath();ctx.moveTo(cx-s,cy);ctx.lineTo(cx-s*0.25,cy+s*0.7);ctx.lineTo(cx+s,cy-s*0.5);ctx.lineWidth=s*0.28;ctx.stroke();ctx.lineWidth=1; return "stroke-only"; } },
  { id:"cross",          label:"✕ Cross",              cat:"Symbols",  draw:(ctx,x,y,w,h)=>{ const s=Math.min(w,h)*0.36,cx=x+w/2,cy=y+h/2,t=s*0.3; ctx.beginPath();ctx.moveTo(cx-s,cy-s+t);ctx.lineTo(cx-t,cy);ctx.lineTo(cx-s,cy+s-t);ctx.lineTo(cx-s+t,cy+s);ctx.lineTo(cx,cy+t);ctx.lineTo(cx+s-t,cy+s);ctx.lineTo(cx+s,cy+s-t);ctx.lineTo(cx+t,cy);ctx.lineTo(cx+s,cy-s+t);ctx.lineTo(cx+s-t,cy-s);ctx.lineTo(cx,cy-t);ctx.lineTo(cx-s+t,cy-s);ctx.closePath(); } },
  { id:"plus",           label:"+ Plus",               cat:"Symbols",  draw:(ctx,x,y,w,h)=>{ const s=Math.min(w,h)*0.42,cx=x+w/2,cy=y+h/2,t=s*0.3; ctx.beginPath();ctx.rect(cx-t/2,cy-s,t,s*2);ctx.rect(cx-s,cy-t/2,s*2,t); } },
  { id:"minus",          label:"— Minus",              cat:"Symbols",  draw:(ctx,x,y,w,h)=>{ const s=Math.min(w,h)*0.42,cx=x+w/2,cy=y+h/2,t=s*0.3; ctx.beginPath();ctx.rect(cx-s,cy-t/2,s*2,t); } },
  { id:"lightning",      label:"⚡ Lightning",          cat:"Symbols",  draw:(ctx,x,y,w,h)=>{ const s=Math.min(w,h)*0.44,cx=x+w/2,cy=y+h/2; ctx.beginPath();ctx.moveTo(cx+s*0.2,cy-s);ctx.lineTo(cx-s*0.3,cy+s*0.1);ctx.lineTo(cx+s*0.05,cy+s*0.1);ctx.lineTo(cx-s*0.2,cy+s);ctx.lineTo(cx+s*0.3,cy-s*0.1);ctx.lineTo(cx-s*0.05,cy-s*0.1);ctx.closePath(); } },
  { id:"heart",          label:"♥ Heart",              cat:"Symbols",  draw:(ctx,x,y,w,h)=>{ const s=Math.min(w,h)*0.42,cx=x+w/2,cy=y+h/2-s*0.1; ctx.beginPath();ctx.moveTo(cx,cy+s*0.7);ctx.bezierCurveTo(cx-s*1.1,cy,cx-s*1.1,cy-s,cx,cy-s*0.4);ctx.bezierCurveTo(cx+s*1.1,cy-s,cx+s*1.1,cy,cx,cy+s*0.7);ctx.closePath(); } },

const fileSafeName = n => n.trim().replace(/[^a-zA-Z0-9-_]+/g,"_").replace(/^_+|_+$/g,"")||"Untitled";
const tsStamp = () => {const d=new Date(),p=n=>String(n).padStart(2,"0");return `${p(d.getDate())}${p(d.getMonth()+1)}${d.getFullYear()}${p(d.getHours())}${p(d.getMinutes())}${p(d.getSeconds())}`;};
const makeAnimStep = (type="fadeIn") => ({ id:uid(), type, duration:0.4, easing:"easeOut", ...(ANIM_PARAM_DEFAULTS[type]||{}) });
const getTimeline = anims => { let t=0; return (anims||[]).map(a => { const s=t; t+=a.duration; return {...a,start:s,end:t}; }); };
const getTotalDur = anims => (anims||[]).reduce((s,a)=>s+a.duration,0);

const ENTRANCES = ["fadeIn","slideInLeft","slideInRight","slideInTop","slideInBottom","scaleIn","bounceIn","rotateIn","typewriter"];
const EXITS = ["fadeOut","scaleOut","slideOutLeft","slideOutRight","slideOutTop","slideOutBottom"];

// Get the visual centre of a layer regardless of type.
// text/emoji store x,y as the draw-centre already; all others store x,y as top-left.
function layerCenter(layer) {
  if (layer.type==="text"||layer.type==="emoji") return { cx: layer.x, cy: layer.y };
  return { cx: layer.x+(layer.width||0)/2, cy: layer.y+(layer.height||0)/2 };
}

function applySingle(ctx, type, progress, easing, layer, cw, ch, step) {
  const ef = EF[easing]||EF.easeOut;
  const p = ef(Math.min(1,Math.max(0,progress)));
  const { cx, cy } = layerCenter(layer);
  switch(type) {
    case "fadeIn": return p;
    case "fadeOut": return 1-p;
    case "slideInLeft": ctx.translate(-cw*(1-p),0); return 1;
    case "slideInRight": ctx.translate(cw*(1-p),0); return 1;
    case "slideOutLeft": ctx.translate(-cw*p,0); return 1;
    case "slideOutRight": ctx.translate(cw*p,0); return 1;
    case "slideInTop": ctx.translate(0,-ch*(1-p)); return 1;
    case "slideInBottom": ctx.translate(0,ch*(1-p)); return 1;
    case "slideOutTop": ctx.translate(0,-ch*p); return 1;
    case "slideOutBottom": ctx.translate(0,ch*p); return 1;
    case "scaleIn": ctx.translate(cx,cy); ctx.scale(p,p); ctx.translate(-cx,-cy); return 1;
    case "scaleOut": { const s=1-p; ctx.translate(cx,cy); ctx.scale(s,s); ctx.translate(-cx,-cy); return 1; }
    case "bounceIn": { const bp=EF.bounce(Math.min(1,Math.max(0,progress))); ctx.translate(cx,cy); ctx.scale(bp,bp); ctx.translate(-cx,-cy); return 1; }
    case "rotateIn": ctx.translate(cx,cy); ctx.rotate((1-p)*Math.PI*2); ctx.scale(p,p); ctx.translate(-cx,-cy); return 1;
    case "rotateCW": ctx.translate(cx,cy); ctx.rotate(p*Math.PI*2); ctx.translate(-cx,-cy); return 1;
    case "rotateCCW": ctx.translate(cx,cy); ctx.rotate(-p*Math.PI*2); ctx.translate(-cx,-cy); return 1;
    case "pulse": { const s2=1+0.2*Math.sin(p*Math.PI); ctx.translate(cx,cy); ctx.scale(s2,s2); ctx.translate(-cx,-cy); return 1; }
    case "shake": { ctx.translate(Math.sin(p*Math.PI*8)*(1-p)*6,0); return 1; }
    case "wiggle": {
      // like shake but rotational: oscillates around the layer centre, damping out
      const amt=(step?.wiggleAmount??15)*Math.PI/180;
      const a=Math.sin(p*Math.PI*8)*(1-p)*amt;
      ctx.translate(cx,cy); ctx.rotate(a); ctx.translate(-cx,-cy); return 1;
    }
    case "move": {
      const mx=(step?.moveX||0)*p, my=(step?.moveY||0)*p;
      ctx.translate(mx,my); return 1;
    }
    case "animScale": {
      const sf=(step?.scaleFrom??1), st=(step?.scaleTo??1.5);
      const sc=sf+(st-sf)*p;
      ctx.translate(cx,cy); ctx.scale(sc,sc); ctx.translate(-cx,-cy); return 1;
    }
    case "animRotate": {
      const rf=(step?.rotFrom??0), rt=(step?.rotTo??360);
      const angle=(rf+(rt-rf)*p)*Math.PI/180;
      ctx.translate(cx,cy); ctx.rotate(angle); ctx.translate(-cx,-cy); return 1;
    }
    case "moveScale": {
      const mx=(step?.moveX||0)*p, my=(step?.moveY||0)*p;
      const sf=(step?.scaleFrom??1), st=(step?.scaleTo??1.5);
      const sc=sf+(st-sf)*p;
      ctx.translate(cx+mx,cy+my); ctx.scale(sc,sc); ctx.translate(-cx,-cy); return 1;
    }
    case "rotateScale": {
      const rf=(step?.rotFrom??0), rt=(step?.rotTo??360);
      const angle=(rf+(rt-rf)*p)*Math.PI/180;
      const sf=(step?.scaleFrom??1), st=(step?.scaleTo??1.5);
      const sc=sf+(st-sf)*p;
      ctx.translate(cx,cy); ctx.rotate(angle); ctx.scale(sc,sc); ctx.translate(-cx,-cy); return 1;
    }
    default: return 1;
  }
}

function getTwProgress(anims, t) {
  for (const s of getTimeline(anims)) {
    if (s.type==="typewriter") {
      if (t<s.start) return 0;
      if (t>=s.end) return 1;
      return (EF[s.easing||"linear"]||EF.linear)(Math.min(1,Math.max(0,(t-s.start)/s.duration)));
    }
  }
  return 1;
}

function drawChain(ctx, layer, cw, ch, t, loopDur=0) {
  const anims = layer.animations||[];
  const { cx, cy } = layerCenter(layer);
  const baseRot = (layer.rotation||0)*Math.PI/180;
  const baseOpacity = layer.opacity??1;

  if (!anims.length) {
    ctx.save();
    if (baseRot) { ctx.translate(cx,cy); ctx.rotate(baseRot); ctx.translate(-cx,-cy); }
    if (baseOpacity!==1) ctx.globalAlpha = Math.max(0,Math.min(1,baseOpacity));
    drawContent(ctx,layer,cw,ch,1,t,loopDur);
    ctx.restore();
    return;
  }
  const tl = getTimeline(anims);
  const isEnt = ENTRANCES.includes(anims[0]?.type);
  if (isEnt && t<0) return;
  ctx.save();
  // Apply base rotation first
  if (baseRot) { ctx.translate(cx,cy); ctx.rotate(baseRot); ctx.translate(-cx,-cy); }
  // Apply base opacity before animation-driven opacity
  let opacity = baseOpacity;
  for (const step of tl) {
    let lp;
    if (t<step.start) lp=0;
    else if (t>=step.end) lp=1;
    else lp=(t-step.start)/step.duration;
    if (lp>=1 && EXITS.includes(step.type)) { ctx.restore(); return; }
    if (lp<=0 && step===tl[0] && isEnt) { ctx.restore(); return; }
    if (lp>0||!isEnt) opacity *= applySingle(ctx,step.type,lp,step.easing,layer,cw,ch,step);
  }
  ctx.globalAlpha = Math.max(0,Math.min(1,opacity));
  drawContent(ctx,layer,cw,ch,getTwProgress(anims,t),t,loopDur);
  ctx.restore();
}

function drawContent(ctx, L, cw, ch, tw, t=0, loopDur=0) {
  if (L.type==="text") {
    const txt = tw<1?L.text.slice(0,Math.ceil(L.text.length*tw)):L.text;
    ctx.font=`${L.bold?"bold ":""}${L.italic?"italic ":""}${L.fontSize}px ${L.fontFamily}`;
    ctx.fillStyle=L.color; ctx.textAlign=L.align||"center"; ctx.textBaseline="middle";
    if (L.shadow){ctx.shadowColor="rgba(0,0,0,0.6)";ctx.shadowBlur=4;ctx.shadowOffsetX=1;ctx.shadowOffsetY=1;}
    if (L.stroke){ctx.strokeStyle=L.strokeColor||"#000";ctx.lineWidth=L.strokeWidth||2;ctx.strokeText(txt,L.x,L.y);}
    ctx.fillText(txt,L.x,L.y);
  } else if (L.type==="rect") {
    ctx.fillStyle=L.color;
    if (L.radius){rrect(ctx,L.x,L.y,L.width,L.height,L.radius);ctx.fill();}else ctx.fillRect(L.x,L.y,L.width,L.height);
    if (L.stroke){ctx.strokeStyle=L.strokeColor||"#000";ctx.lineWidth=L.strokeWidth||2;if(L.radius){rrect(ctx,L.x,L.y,L.width,L.height,L.radius);ctx.stroke();}else ctx.strokeRect(L.x,L.y,L.width,L.height);}
  } else if (L.type==="circle") {
    ctx.fillStyle=L.color; ctx.beginPath(); ctx.arc(L.x+L.radius,L.y+L.radius,L.radius,0,Math.PI*2); ctx.fill();
    if (L.stroke){ctx.strokeStyle=L.strokeColor||"#000";ctx.lineWidth=L.strokeWidth||2;ctx.stroke();}
  } else if (L.type==="emoji") {
    ctx.font=`${L.fontSize}px serif`; ctx.textAlign="center"; ctx.textBaseline="middle"; ctx.fillText(L.text,L.x,L.y);
  } else if (L.type==="image"&&L.img) {
    try{ctx.drawImage(L.img,L.x,L.y,L.width,L.height);}catch(e){}
  } else if (L.type==="ants") {
    /* Marching ants: animated dashed stroke around a (rounded) rectangle.
       Ant style is done with dash patterns + line caps:
       rect = long dash (round caps if antRounded), square = dash length == thickness,
       circle = near-zero dash with round caps (dots). Offset moves with time t.
       Speed is snapped so the ants travel a whole number of dash periods over
       loopDur, making the animation wrap seamlessly at the loop point. */
    const sz=Math.max(1,L.antSize||4), gap=Math.max(1,L.antGap??8);
    ctx.save();
    ctx.globalAlpha=ctx.globalAlpha*Math.max(0,Math.min(1,L.antAlpha??1));
    ctx.strokeStyle=L.color||"#ffffff";
    ctx.lineWidth=sz;
    let period;
    if(L.antShape==="circle"){ctx.setLineDash([0.01,gap+sz]);ctx.lineCap="round";period=0.01+gap+sz;}
    else if(L.antShape==="square"){ctx.setLineDash([sz,gap]);ctx.lineCap="butt";period=sz+gap;}
    else{const len=Math.max(1,L.antLen??10);ctx.setLineDash([len,gap]);ctx.lineCap=L.antRounded?"round":"butt";period=len+gap;}
    let speed=L.antSpeed??30;
    if(loopDur>0&&speed>0)speed=Math.max(1,Math.round(speed*loopDur/period))*period/loopDur;
    ctx.lineDashOffset=(L.antDir==="ccw"?1:-1)*t*speed;
    const r=Math.min(L.radius||0,Math.min(L.width,L.height)/2);
    if(r>0)rrect(ctx,L.x,L.y,L.width,L.height,r);else{ctx.beginPath();ctx.rect(L.x,L.y,L.width,L.height);}
    ctx.stroke();
    ctx.restore();
  } else if (L.type==="svg") {
    const icon = SVG_ICONS.find(i=>i.id===L.iconId);
    if (icon) {
      ctx.save();
      ctx.fillStyle = L.color;
      ctx.strokeStyle = L.strokeColor||L.color;
      ctx.lineWidth = L.strokeWidth||2;
      const result = icon.draw(ctx, L.x, L.y, L.width, L.height);
      if (result==="stroke-only") {
        // already stroked in draw fn, nothing
      } else if (result==="cutout") {
        ctx.fillStyle = L.color;
        ctx.fill("evenodd");
      } else if (result==="eye") {
        // eye white part already filled in draw fn, now fill pupil dark
        ctx.fillStyle = "rgba(0,0,0,0.75)";
        ctx.fill();
      } else if (result==="stroke-mic") {
        ctx.lineWidth = L.strokeWidth||Math.min(L.width,L.height)*0.07;
        ctx.strokeStyle = L.color;
        ctx.stroke();
      } else {
        ctx.fillStyle = L.color;
        ctx.fill();
      }
      if (L.stroke && result!=="stroke-only" && result!=="stroke-mic") {
        ctx.strokeStyle = L.strokeColor||"#fff";
        ctx.lineWidth = L.strokeWidth||2;
        icon.draw(ctx, L.x, L.y, L.width, L.height);
        ctx.stroke();
      }
      ctx.restore();
    }
  }
}

function rrect(ctx,x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.lineTo(x+w-r,y);ctx.quadraticCurveTo(x+w,y,x+w,y+r);ctx.lineTo(x+w,y+h-r);ctx.quadraticCurveTo(x+w,y+h,x+w-r,y+h);ctx.lineTo(x+r,y+h);ctx.quadraticCurveTo(x,y+h,x,y+h-r);ctx.lineTo(x,y+r);ctx.quadraticCurveTo(x,y,x+r,y);ctx.closePath();}

function renderFrame(canvas, layers, bgColor, bgGrad, absTime, bgTransparent, loopDur=0) {
  const ctx=canvas.getContext("2d"), w=canvas.width, h=canvas.height;
  ctx.clearRect(0,0,w,h);
  if (!bgTransparent) {
    if (bgGrad&&bgGrad.enabled) {
      let g;
      if (bgGrad.style==="radial") {
        g=ctx.createRadialGradient(w/2,h/2,0,w/2,h/2,Math.hypot(w,h)/2);
      } else {
        // linear: angle in degrees, 0 = left→right, 90 = top→bottom
        const a=((bgGrad.angle??90)%360)*Math.PI/180;
        const dx=Math.cos(a),dy=Math.sin(a),r=(Math.abs(dx)*w+Math.abs(dy)*h)/2;
        g=ctx.createLinearGradient(w/2-dx*r,h/2-dy*r,w/2+dx*r,h/2+dy*r);
      }
      // radial spread: how long colour1 stays dominant before blending starts
      const first=bgGrad.style==="radial"?Math.max(0,Math.min(0.95,bgGrad.radialSpread??0)):0;
      g.addColorStop(first,bgGrad.color1);g.addColorStop(1,bgGrad.color2);ctx.fillStyle=g;
    } else ctx.fillStyle=bgColor;
    ctx.fillRect(0,0,w,h);
  }
  layers.forEach(L=>{if(!L.visible)return;drawChain(ctx,L,w,h,absTime-(L.animStartDelay||0),loopDur);});
}

class GIFEncoder {
  constructor(w,h,transparent=false){this.w=w;this.h=h;this.frames=[];this.delay=50;this.transparent=transparent;}
  setDelay(ms){this.delay=ms;}
  addFrame(ctx){const d=ctx.getImageData(0,0,this.w,this.h);const{palette:p,indexed:i}=this.quantize(d.data);this.frames.push({palette:p,indexed:i,delay:this.delay});}
  quantize(px){const cm=new Map(),idx=new Uint8Array(this.w*this.h),pal=[];const t0=this.transparent?1:0;if(this.transparent)pal.push([0,0,0]);for(let i=0;i<px.length;i+=4){if(this.transparent&&px[i+3]<128){idx[i/4]=0;continue;}const r=px[i]&0xF8,g=px[i+1]&0xFC,b=px[i+2]&0xF8,k=(r<<16)|(g<<8)|b;if(!cm.has(k)){if(pal.length>=256){let best=t0,bd=1e9;for(let j=t0;j<pal.length;j++){const dr=pal[j][0]-r,dg=pal[j][1]-g,db=pal[j][2]-b,d2=dr*dr+dg*dg+db*db;if(d2<bd){bd=d2;best=j;}}idx[i/4]=best;continue;}cm.set(k,pal.length);pal.push([r,g,b]);}idx[i/4]=cm.get(k);}while(pal.length<256)pal.push([0,0,0]);return{palette:pal,indexed:idx};}
  toBlob(){const b=[],w=v=>{b.push(v&0xFF,(v>>8)&0xFF);};[0x47,0x49,0x46,0x38,0x39,0x61].forEach(x=>b.push(x));w(this.w);w(this.h);b.push(0x70,0,0);b.push(0x21,0xFF,0x0B);[..."NETSCAPE2.0"].forEach(c=>b.push(c.charCodeAt(0)));b.push(3,1);w(0);b.push(0);this.frames.forEach(f=>{b.push(0x21,0xF9,4,this.transparent?0x09:0);w(Math.round(f.delay/10));b.push(0,0);b.push(0x2C);w(0);w(0);w(this.w);w(this.h);b.push(0x87);f.palette.forEach(c=>{b.push(c[0],c[1],c[2]);});b.push(8);const lzw=this.lzwEnc(f.indexed,8);let o=0;while(o<lzw.length){const ch=Math.min(255,lzw.length-o);b.push(ch);for(let i=0;i<ch;i++)b.push(lzw[o++]);}b.push(0);});b.push(0x3B);return new Blob([new Uint8Array(b)],{type:"image/gif"});}
  lzwEnc(idx,mc){const cc=1<<mc,eoi=cc+1;let cs=mc+1,nc=eoi+1;const t=new Map(),out=[];let bits=0,bp=0;const emit=c=>{bits|=c<<bp;bp+=cs;while(bp>=8){out.push(bits&0xFF);bits>>=8;bp-=8;}};const reset=()=>{t.clear();for(let i=0;i<cc;i++)t.set(String(i),i);nc=eoi+1;cs=mc+1;};emit(cc);reset();let prev=String(idx[0]);for(let i=1;i<idx.length;i++){const curr=String(idx[i]),comb=prev+","+curr;if(t.has(comb))prev=comb;else{emit(t.get(prev));if(nc<4096){t.set(comb,nc++);if(nc>(1<<cs)&&cs<12)cs++;}else{emit(cc);reset();}prev=curr;}}emit(t.get(prev));emit(eoi);if(bp>0)out.push(bits&0xFF);return out;}
}

/* Animated WebP muxer: takes per-frame WebP files (browser-encoded) and wraps them
   in a RIFF container with VP8X + ANIM + ANMF chunks. Full 8-bit alpha is preserved. */
function buildAnimWebP(frames, w, h, delayMs) {
  const u24=v=>[v&255,(v>>8)&255,(v>>16)&255];
  const u32=v=>[v&255,(v>>8)&255,(v>>16)&255,(v>>>24)&255];
  const cc4=s=>[...s].map(ch=>ch.charCodeAt(0));
  const mkChunk=(cc,payload)=>{const out=new Uint8Array(8+payload.length+(payload.length&1));out.set(cc4(cc),0);out.set(u32(payload.length),4);out.set(payload,8);return out;};
  const parse=buf=>{const dv=new DataView(buf.buffer,buf.byteOffset,buf.byteLength);const cs=[];let o=12;while(o+8<=buf.length){const cc=String.fromCharCode(buf[o],buf[o+1],buf[o+2],buf[o+3]);const sz=dv.getUint32(o+4,true);cs.push({cc,data:buf.subarray(o+8,Math.min(o+8+sz,buf.length))});o+=8+sz+(sz&1);}return cs;};
  let hasAlpha=false;
  const anmfs=frames.map(f=>{
    // keep only the image-data chunks (ALPH must stay ahead of VP8; order is preserved)
    const imgChunks=parse(f).filter(c=>c.cc==="ALPH"||c.cc==="VP8 "||c.cc==="VP8L");
    if(imgChunks.some(c=>c.cc==="ALPH"||c.cc==="VP8L"))hasAlpha=true;
    const hdr=[...u24(0),...u24(0),...u24(w-1),...u24(h-1),...u24(delayMs),0x02]; // flags 0x02 = no blend
    const encoded=imgChunks.map(c=>mkChunk(c.cc,c.data));
    const payload=new Uint8Array(16+encoded.reduce((s,e)=>s+e.length,0));
    payload.set(hdr,0);let o=16;encoded.forEach(e=>{payload.set(e,o);o+=e.length;});
    return mkChunk("ANMF",payload);
  });
  const vp8x=mkChunk("VP8X",new Uint8Array([(hasAlpha?0x10:0)|0x02,0,0,0,...u24(w-1),...u24(h-1)]));
  const anim=mkChunk("ANIM",new Uint8Array([0,0,0,0,0,0])); // bg colour 0, loop count 0 = infinite
  const bodyLen=vp8x.length+anim.length+anmfs.reduce((s,a)=>s+a.length,0);
  const out=new Uint8Array(12+bodyLen);
  out.set(cc4("RIFF"),0);out.set(u32(4+bodyLen),4);out.set(cc4("WEBP"),8);
  let o=12;[vp8x,anim,...anmfs].forEach(ch=>{out.set(ch,o);o+=ch.length;});
  return new Blob([out],{type:"image/webp"});
}

function SvgIconPreview({icon, size=32}) {
  const ref = useRef(null);
  useEffect(()=>{
    const c = ref.current; if(!c) return;
    const ctx = c.getContext("2d");
    ctx.clearRect(0,0,size,size);
    ctx.fillStyle="#ffffff"; ctx.strokeStyle="#ffffff"; ctx.lineWidth=size*0.07;
    const result = icon.draw(ctx, 2, 2, size-4, size-4);
    if (result==="stroke-only"||result==="stroke-mic") { ctx.strokeStyle="#fff"; ctx.stroke(); }
    else if (result==="cutout") { ctx.fillStyle="#fff"; ctx.fill("evenodd"); }
    else { ctx.fillStyle="#fff"; ctx.fill(); }
  },[icon,size]);
  return <canvas ref={ref} width={size} height={size} style={{width:size,height:size}}/>;
}

    reader.onload=async()=>{
      try{
        const proj=JSON.parse(reader.result);
        if(proj.app!=="StreamDeckButtonCreator"||!Array.isArray(proj.layers))throw new Error("not a Stream Deck Button Creator project file");
        const restored=await Promise.all(proj.layers.map(raw=>{
          // merge over mkBase-style defaults so files from older versions stay loadable
          const {img,imgSrc,...rest}=raw;
          const base={id:uid(),visible:true,animations:[],animStartDelay:0,rotation:0,opacity:1,...rest};
          if(raw.type==="image"&&imgSrc){
            return new Promise((res,rej)=>{
              const im=new Image();
              im.onload=()=>res({...base,img:im});
              im.onerror=()=>rej(new Error("an embedded image could not be restored"));
              im.src=imgSrc;
            });
          }
          return Promise.resolve(base);
        }));
        setPlaying(false);setCurTime(0);setSelectedId(null);setSelAnimIdx(0);setDrag(null);
        setProjectName(typeof proj.name==="string"?proj.name:"");
        if(proj.canvas){setCanvasW(Math.max(16,+proj.canvas.w||144));setCanvasH(Math.max(16,+proj.canvas.h||144));}
        if(proj.background){
          setBgColor(proj.background.color||"#1a1a2e");
          setBgTransparent(!!proj.background.transparent);
          setBgGrad({enabled:false,color1:"#1a1a2e",color2:"#16213e",angle:90,style:"linear",radialSpread:0,...(proj.background.gradient||{})});
        }
        if(proj.timeline){setTotalDur(+proj.timeline.totalDur||2);setFps(Math.max(5,Math.min(60,+proj.timeline.fps||30)));}
        setLayers(restored);
      }catch(err){alert("Could not load project: "+(err.message||err));}
    };
    reader.onerror=()=>alert("Could not read the selected file");
    reader.readAsText(f);
  };

  // Fit the timeline to the longest animation chain (start delay + step durations)
  const fitDuration=()=>{
    const m=layers.reduce((mx,l)=>Math.max(mx,(l.animStartDelay||0)+getTotalDur(l.animations)),0);
    if(m>0){setTotalDur(Math.max(0.5,Math.round(m*100)/100));setCurTime(0);}
  };

  const cs=zoomFit?Math.min(280/canvasW,280/canvasH):1;
  const NI={background:"#1a1a28",border:"1px solid #2a2a3e",borderRadius:4,color:"#ddd",padding:"4px 6px",fontSize:11,width:56,outline:"none"};
  const AB={padding:"4px 10px",fontSize:11,borderRadius:5,background:"#1e1e2e",color:"#ccc",border:"1px solid #2a2a3e",cursor:"pointer",whiteSpace:"nowrap"};
  const TB={background:"none",border:"none",color:"#777",cursor:"pointer",fontSize:10,padding:"0 2px"};
  const EB={padding:"8px 18px",fontSize:12,fontWeight:600,borderRadius:8,background:"linear-gradient(135deg,#1e1e2e,#2a2a3e)",color:"#ddd",border:"1px solid #3a3a4e",cursor:"pointer"};

  const PRESETS_ANIM = [
    {label:"Fade In→Out",steps:[{type:"fadeIn",d:0.4},{type:"hold",d:0.8},{type:"fadeOut",d:0.4}]},
    {label:"Slide In→Out",steps:[{type:"slideInLeft",d:0.3},{type:"hold",d:0.6},{type:"slideOutRight",d:0.3}]},
    {label:"Bounce→Rotate",steps:[{type:"bounceIn",d:0.5},{type:"rotateCW",d:0.8}]},
    {label:"Scale→Pulse→Fade",steps:[{type:"scaleIn",d:0.3},{type:"pulse",d:0.6},{type:"fadeOut",d:0.3}]},
    {label:"Type→Hold→Fade",steps:[{type:"typewriter",d:0.6},{type:"hold",d:0.6},{type:"fadeOut",d:0.3}]},
  ];

  return (
    <div style={{minHeight:"100vh",background:"#0d0d12",fontFamily:"'Segoe UI',system-ui,sans-serif",color:"#e0e0e8",display:"flex",flexDirection:"column"}}>
      <div style={{background:"linear-gradient(135deg,#12121a,#1a1a2e)",borderBottom:"1px solid #2a2a3e",padding:"12px 24px",display:"flex",alignItems:"center",gap:16}}>
        <div style={{width:32,height:32,borderRadius:8,background:"linear-gradient(135deg,#e94560,#c23152)",display:"flex",alignItems:"center",justifyContent:"center",fontSize:16,fontWeight:900}}>SD</div>
        <div><div style={{fontWeight:700,fontSize:16,letterSpacing:"0.5px"}}>Stream Deck Button Creator <span style={{fontSize:11,fontWeight:400,color:"#666"}}>v{APP_VERSION}</span></div><div style={{fontSize:11,color:"#888",marginTop:1}}>Design animated buttons with chained animations</div></div>
        <div style={{flex:1,display:"flex",justifyContent:"center"}}>
          <input value={projectName} onChange={e=>setProjectName(e.target.value)} placeholder="Untitled project — click to name" spellCheck={false}
            style={{background:"#1a1a28",border:"1px solid #2a2a3e",borderRadius:6,color:"#ddd",padding:"6px 12px",fontSize:13,textAlign:"center",width:"100%",maxWidth:300,outline:"none"}}/>
        </div>
        <button onClick={saveProject} style={{...AB,padding:"6px 14px"}}>💾 Save Project</button>
        <button onClick={()=>projRef.current?.click()} style={{...AB,padding:"6px 14px"}}>📂 Open Project</button>
        <button onClick={resetProject} style={{...AB,padding:"6px 14px",background:"#3a1020",color:"#e94560",borderColor:"#5a1530"}}>🗑 Reset</button>
        <input ref={projRef} type="file" accept=".sdproj,.json,application/json" onChange={loadProject} style={{display:"none"}}/>
      </div>
      <div style={{display:"flex",flex:1,overflow:"hidden"}}>
        {/* LEFT PANEL */}
        <div style={{width:260,background:"#111118",borderRight:"1px solid #2a2a3e",display:"flex",flexDirection:"column",overflow:"hidden"}}>
          <div style={{padding:"12px 14px",borderBottom:"1px solid #1e1e2e"}}>
            <SL>Canvas Size</SL>
            <div style={{display:"flex",gap:6,flexWrap:"wrap",marginBottom:6}}>
              {PRESETS.map(p=><button key={p.label} onClick={()=>{setCanvasW(p.w);setCanvasH(p.h);}} style={{padding:"3px 8px",fontSize:10,borderRadius:4,background:canvasW===p.w&&canvasH===p.h?"#e94560":"#1e1e2e",color:canvasW===p.w&&canvasH===p.h?"#fff":"#aaa",border:"1px solid #2a2a3e",cursor:"pointer"}}>{p.label}</button>)}
            </div>
            <div style={{display:"flex",gap:6,flexWrap:"wrap",marginBottom:8}}>
              {GENERIC_SIZES.map(s=><button key={s} onClick={()=>{setCanvasW(s);setCanvasH(s);}} title={`${s} x ${s}px`} style={{padding:"3px 8px",fontSize:10,borderRadius:4,background:canvasW===s&&canvasH===s?"#e94560":"#1e1e2e",color:canvasW===s&&canvasH===s?"#fff":"#aaa",border:"1px solid #2a2a3e",cursor:"pointer"}}>{s}²</button>)}
            </div>
            <div style={{display:"flex",gap:6,alignItems:"center"}}>
              <input type="number" value={canvasW} onChange={e=>setCanvasW(Math.max(16,+e.target.value))} style={NI}/><span style={{color:"#555",fontSize:12}}>x</span><input type="number" value={canvasH} onChange={e=>setCanvasH(Math.max(16,+e.target.value))} style={NI}/>
            </div>
          </div>
          <div style={{padding:"10px 14px",borderBottom:"1px solid #1e1e2e"}}>
            <SL>Background</SL>
            <div style={{display:"flex",gap:8,alignItems:"center",marginBottom:6}}>
              {!bgTransparent&&<input type="color" value={bgColor} onChange={e=>setBgColor(e.target.value)} style={{width:28,height:28,border:"none",borderRadius:4,cursor:"pointer",background:"none"}}/>}
              <label style={{fontSize:11,color:"#888",display:"flex",alignItems:"center",gap:4}}><input type="checkbox" checked={bgTransparent} onChange={e=>setBgTransparent(e.target.checked)}/>Transparent</label>
              {!bgTransparent&&<label style={{fontSize:11,color:"#888",display:"flex",alignItems:"center",gap:4}}><input type="checkbox" checked={bgGrad.enabled} onChange={e=>setBgGrad({...bgGrad,enabled:e.target.checked})}/>Gradient</label>}
            </div>
            {!bgTransparent&&bgGrad.enabled&&<div style={{display:"flex",flexDirection:"column",gap:6}}>
              <div style={{display:"flex",gap:6,alignItems:"center"}}>
                <input type="color" value={bgGrad.color1} onChange={e=>setBgGrad({...bgGrad,color1:e.target.value})} style={{width:24,height:24,border:"none",borderRadius:4,cursor:"pointer"}}/>
                <span style={{color:"#555",fontSize:11}}>to</span>
                <input type="color" value={bgGrad.color2} onChange={e=>setBgGrad({...bgGrad,color2:e.target.value})} style={{width:24,height:24,border:"none",borderRadius:4,cursor:"pointer"}}/>
                <div style={{flex:1}}/>
                {[{v:"linear",l:"Linear"},{v:"radial",l:"Radial"}].map(o=><button key={o.v} onClick={()=>setBgGrad({...bgGrad,style:o.v})} style={{padding:"2px 8px",fontSize:10,borderRadius:4,background:(bgGrad.style||"linear")===o.v?"#e94560":"#1e1e2e",color:(bgGrad.style||"linear")===o.v?"#fff":"#aaa",border:"1px solid #2a2a3e",cursor:"pointer"}}>{o.l}</button>)}
              </div>
              {(bgGrad.style||"linear")==="linear"&&<div style={{display:"flex",gap:6,alignItems:"center"}}>
                <span style={{fontSize:10,color:"#777"}}>Angle</span>
                <input type="range" min={0} max={360} step={5} value={bgGrad.angle??90} onChange={e=>setBgGrad({...bgGrad,angle:+e.target.value})} style={{flex:1}}/>
                <span style={{fontSize:10,color:"#888",width:28,textAlign:"right"}}>{bgGrad.angle??90}°</span>
              </div>}
              {bgGrad.style==="radial"&&<div style={{display:"flex",gap:6,alignItems:"center"}}>
                <span style={{fontSize:10,color:"#777"}} title="How far the first colour stays dominant before blending">Spread</span>
                <input type="range" min={0} max={0.9} step={0.05} value={bgGrad.radialSpread??0} onChange={e=>setBgGrad({...bgGrad,radialSpread:+e.target.value})} style={{flex:1}}/>
                <span style={{fontSize:10,color:"#888",width:28,textAlign:"right"}}>{Math.round((bgGrad.radialSpread??0)*100)}%</span>
              </div>}
            </div>}
          </div>
          <div style={{padding:"10px 14px",borderBottom:"1px solid #1e1e2e"}}>
            <SL>Add Layer</SL>
            <div style={{display:"flex",gap:4,flexWrap:"wrap"}}>
              {[{l:"T Text",f:addText},{l:"◼ Rect",f:addRect},{l:"● Circle",f:addCircle},{l:"😀 Emoji",f:()=>{setShowEmoji(!showEmoji);setShowSvg(false);}},{l:"✦ Icons",f:()=>{setShowSvg(!showSvg);setShowEmoji(false);}},{l:"📷 Image",f:()=>fileRef.current?.click()},{l:"⬚ Ants",f:addAnts}].map(b=><button key={b.l} onClick={b.f} style={AB}>{b.l}</button>)}
            </div>
            <input ref={fileRef} type="file" accept="image/*" onChange={addImg} style={{display:"none"}}/>
            {showEmoji&&<div style={{marginTop:6,display:"grid",gridTemplateColumns:"repeat(8,1fr)",gap:2,background:"#1a1a28",borderRadius:6,padding:6,maxHeight:120,overflowY:"auto"}}>{EMOJIS.map(em=><button key={em} onClick={()=>addEmoji(em)} style={{fontSize:16,background:"none",border:"none",cursor:"pointer",padding:2,borderRadius:4}} onMouseOver={ev=>ev.target.style.background="#2a2a3e"} onMouseOut={ev=>ev.target.style.background="none"}>{em}</button>)}</div>}
            {showSvg&&<div style={{marginTop:6,background:"#1a1a28",borderRadius:6,padding:6}}>
              <div style={{display:"flex",gap:3,flexWrap:"wrap",marginBottom:6}}>
                {SVG_CATS.map(cat=><button key={cat} onClick={()=>setSvgCat(cat)} style={{padding:"2px 7px",fontSize:9,borderRadius:4,background:svgCat===cat?"#e94560":"#1e1e2e",color:svgCat===cat?"#fff":"#aaa",border:"1px solid #2a2a3e",cursor:"pointer"}}>{cat}</button>)}
              </div>
              <div style={{display:"grid",gridTemplateColumns:"repeat(4,1fr)",gap:3,maxHeight:150,overflowY:"auto"}}>
                {SVG_ICONS.filter(i=>i.cat===svgCat).map(icon=><button key={icon.id} onClick={()=>addSvgShape(icon)} title={icon.label} style={{background:"#1e1e2e",border:"1px solid #2a2a3e",borderRadius:5,cursor:"pointer",padding:4,display:"flex",flexDirection:"column",alignItems:"center",gap:2}} onMouseOver={ev=>ev.currentTarget.style.background="#2a2a3e"} onMouseOut={ev=>ev.currentTarget.style.background="#1e1e2e"}>
                  <SvgIconPreview icon={icon} size={32}/>
                  <span style={{fontSize:8,color:"#888",textAlign:"center",lineHeight:1.2,whiteSpace:"nowrap",overflow:"hidden",textOverflow:"ellipsis",width:"100%"}}>{icon.label.replace(/^[^\s]+\s/,"")}</span>
                </button>)}
              </div>
            </div>}
          </div>
          <div style={{flex:1,overflowY:"auto",padding:"6px 0"}}>
            <div style={{padding:"0 14px 4px",fontSize:10,fontWeight:700,textTransform:"uppercase",letterSpacing:1.2,color:"#666"}}>Layers ({layers.length})</div>
            {!layers.length&&<div style={{padding:"20px 14px",textAlign:"center",color:"#444",fontSize:12}}>No layers yet</div>}
            {[...layers].reverse().map(l=>(
              <div key={l.id} onClick={()=>{setSelectedId(l.id);setSelAnimIdx(0);}} style={{padding:"6px 14px",cursor:"pointer",display:"flex",alignItems:"center",gap:8,background:selectedId===l.id?"#1e1e32":"transparent",borderLeft:selectedId===l.id?"2px solid #e94560":"2px solid transparent"}}>
                <span style={{fontSize:12,width:20,textAlign:"center",flexShrink:0}}>{l.type==="text"?"T":l.type==="rect"?"◼":l.type==="circle"?"●":l.type==="emoji"?l.text:l.type==="svg"?"✦":l.type==="ants"?"⬚":"📷"}</span>
                <span style={{fontSize:11,flex:1,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{l.type==="text"?l.text:l.type==="emoji"?"Emoji":l.type==="image"?"Image":l.type==="ants"?"Marching Ants":l.type==="svg"?(SVG_ICONS.find(i=>i.id===l.iconId)?.label.replace(/^[^\s]+\s/,"")||"Icon"):l.type}</span>
                {(l.animations||[]).length>0&&<span style={{fontSize:9,color:"#e94560",background:"#2a1525",padding:"1px 4px",borderRadius:3}}>{l.animations.length}✦</span>}
                <button onClick={e=>{e.stopPropagation();upLayer(l.id,{visible:!l.visible});}} style={{background:"none",border:"none",color:l.visible?"#888":"#444",cursor:"pointer",fontSize:11}}>{l.visible?"👁":"👁‍🗨"}</button>
                <button onClick={e=>{e.stopPropagation();delLayer(l.id);}} style={{background:"none",border:"none",color:"#e94560",cursor:"pointer",fontSize:11,fontWeight:700}}>✕</button>
              </div>
            ))}
          </div>
        </div>

        {/* CENTER */}
        <div style={{flex:1,display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",gap:16,padding:24}}>
          <div style={{background:"#18181f",borderRadius:12,padding:24,boxShadow:"0 8px 32px rgba(0,0,0,0.4)",border:"1px solid #2a2a3e"}}>
            <div style={{position:"relative",width:canvasW*cs,height:canvasH*cs,borderRadius:4,overflow:"hidden",boxShadow:"0 2px 12px rgba(0,0,0,0.5)",background:bgTransparent?"repeating-conic-gradient(#3a3a46 0% 25%, #23232d 0% 50%) 0 0 / 16px 16px":"none"}}>
              <canvas ref={canvasRef} style={{width:canvasW*cs,height:canvasH*cs,display:"block",cursor:drag?"grabbing":"grab"}} onMouseDown={onDown} onMouseMove={onMove} onMouseUp={onUp} onMouseLeave={onUp}/>
            </div>
            <div style={{textAlign:"center",marginTop:8,fontSize:11,color:"#555",display:"flex",alignItems:"center",justifyContent:"center",gap:8}}>
              <span>{canvasW} x {canvasH}px</span>
              {[{l:"Fit",v:true},{l:"1:1",v:false}].map(o=><button key={o.l} onClick={()=>setZoomFit(o.v)} title={o.v?"Scale preview to fit the working area":"Show at actual pixel size"} style={{padding:"2px 8px",fontSize:10,borderRadius:4,background:zoomFit===o.v?"#e94560":"#1e1e2e",color:zoomFit===o.v?"#fff":"#aaa",border:"1px solid #2a2a3e",cursor:"pointer"}}>{o.l}</button>)}
            </div>
          </div>
          <div style={{background:"#111118",borderRadius:10,padding:"12px 20px",width:"100%",maxWidth:480,border:"1px solid #2a2a3e"}}>
            <div style={{display:"flex",alignItems:"center",gap:10,marginBottom:8}}>
              <button onClick={()=>{setPlaying(!playing);if(!playing)setCurTime(0);}} style={{width:32,height:32,borderRadius:"50%",background:playing?"#e94560":"#2a2a3e",border:"none",color:"#fff",fontSize:14,cursor:"pointer",display:"flex",alignItems:"center",justifyContent:"center"}}>{playing?"⏸":"▶"}</button>
              <button onClick={()=>{setPlaying(false);setCurTime(0);}} style={{background:"#1e1e2e",border:"1px solid #2a2a3e",borderRadius:6,padding:"4px 10px",color:"#aaa",cursor:"pointer",fontSize:11}}>⏹ Reset</button>
              <span style={{fontSize:10,color:"#888",fontFamily:"monospace"}}>{curTime.toFixed(1)}s / {totalDur}s</span>
              <div style={{flex:1}}/>
              <label style={{fontSize:10,color:"#666",display:"flex",alignItems:"center",gap:4}}>Dur <input type="number" value={totalDur} min={0.5} max={30} step={0.5} onChange={e=>setTotalDur(+e.target.value)} style={{...NI,width:48}}/>s</label>
              <button onClick={fitDuration} title="Set duration to match the longest animation chain" style={{background:"#1e1e2e",border:"1px solid #2a2a3e",borderRadius:6,padding:"4px 10px",color:"#aaa",cursor:"pointer",fontSize:11}}>⇥ Fit</button>
            </div>
            <div style={{height:6,background:"#1e1e2e",borderRadius:3,position:"relative",cursor:"pointer",marginBottom:8}} onClick={e=>{const r=e.currentTarget.getBoundingClientRect();setCurTime(((e.clientX-r.left)/r.width)*totalDur);}}>
              <div style={{position:"absolute",left:0,top:0,height:"100%",width:`${(curTime/totalDur)*100}%`,background:"linear-gradient(90deg,#e94560,#c23152)",borderRadius:3,transition:playing?"none":"width 0.1s"}}/>
            </div>
            {sel&&selAnims.length>0&&(
              <div style={{marginTop:4}}>
                <div style={{fontSize:9,color:"#555",marginBottom:3}}>Animation chain for "{sel.type==="text"?sel.text:sel.type}"</div>
                <div style={{display:"flex",height:22,background:"#1a1a28",borderRadius:4,overflow:"hidden",position:"relative"}}>
                  {(()=>{const sd=sel.animStartDelay||0;const tl=getTimeline(selAnims);const dp=(sd/totalDur)*100;return(<React.Fragment>{sd>0&&<div style={{width:`${dp}%`,background:"#1e1e2e",display:"flex",alignItems:"center",justifyContent:"center"}}><span style={{fontSize:8,color:"#555"}}>delay</span></div>}{tl.map((s,i)=>{const pct=(s.duration/totalDur)*100;return(<div key={s.id} onClick={ev=>{ev.stopPropagation();setSelAnimIdx(i);}} style={{width:`${pct}%`,minWidth:2,background:selAnimIdx===i?(AC[s.type]||"#666"):(AC[s.type]||"#666")+"88",display:"flex",alignItems:"center",justifyContent:"center",cursor:"pointer",borderRight:"1px solid #0d0d12"}}><span style={{fontSize:7,color:"#000",fontWeight:700,overflow:"hidden",whiteSpace:"nowrap",textOverflow:"ellipsis",padding:"0 2px"}}>{ANIM_TYPES.find(a=>a.id===s.type)?.label||s.type}</span></div>);})}</React.Fragment>);})()}
                  <div style={{position:"absolute",left:`${(curTime/totalDur)*100}%`,top:0,width:1,height:"100%",background:"#fff",opacity:0.6,pointerEvents:"none"}}/>
                </div>
              </div>
            )}
          </div>
          <div style={{display:"flex",gap:10,alignItems:"center"}}>
            <button onClick={expPNG} style={EB}>📷 Export PNG</button>
            <button onClick={expGIF} disabled={exporting} style={{...EB,background:exporting?"#333":"linear-gradient(135deg,#e94560,#c23152)",cursor:exporting?"wait":"pointer"}}>{exporting?"⏳ Encoding...":"🎬 Export GIF"}</button>
            <button onClick={expWebP} disabled={exportingWebP} style={{...EB,background:exportingWebP?"#333":"linear-gradient(135deg,#3a7bd5,#2a5b9d)",cursor:exportingWebP?"wait":"pointer"}}>{exportingWebP?"⏳ Encoding...":"🎞 Export WebP"}</button>
            <label style={{fontSize:10,color:"#666",display:"flex",alignItems:"center",gap:4}}>FPS
              {[15,30,60].map(v=><button key={v} onClick={()=>setFps(v)} style={{padding:"3px 8px",fontSize:10,borderRadius:4,background:fps===v?"#e94560":"#1e1e2e",color:fps===v?"#fff":"#aaa",border:"1px solid #2a2a3e",cursor:"pointer"}}>{v}</button>)}
              <input type="number" value={fps} min={5} max={60} onChange={e=>setFps(Math.max(5,Math.min(60,+e.target.value)))} style={{...NI,width:40}}/>
            </label>
          </div>
        </div>

        {/* RIGHT PANEL */}
        <div style={{width:290,background:"#111118",borderLeft:"1px solid #2a2a3e",overflowY:"auto",padding:"12px 14px"}}>
          {!sel?<div style={{textAlign:"center",color:"#444",marginTop:40,fontSize:12}}>Select a layer to edit</div>:(
            <React.Fragment>
              <div style={{fontSize:10,fontWeight:700,textTransform:"uppercase",letterSpacing:1.2,color:"#666",marginBottom:10}}>{sel.type.toUpperCase()} Properties</div>
              <PS t="Position">{(()=>{
                // helpers: does this layer type use x,y as top-left or draw-centre?
                const isCentered = sel.type==="text"||sel.type==="emoji";
                const lw = isCentered ? (sel.width||sel.fontSize||0) : (sel.width||0);
                const lh = isCentered ? (sel.height||sel.fontSize||0) : (sel.height||0);
                const centerX = ()=> upLayer(sel.id,{x: isCentered ? Math.round(canvasW/2) : Math.round((canvasW-lw)/2)});
                const centerY = ()=> upLayer(sel.id,{y: isCentered ? Math.round(canvasH/2) : Math.round((canvasH-lh)/2)});
                const mirrorX = ()=> upLayer(sel.id,{
                  x: isCentered ? canvasW - sel.x : canvasW - sel.x - lw,
                  rotation: -(sel.rotation||0)
                });
                const mirrorY = ()=> upLayer(sel.id,{
                  y: isCentered ? canvasH - sel.y : canvasH - sel.y - lh,
                  rotation: -(sel.rotation||0)
                });
                const btnStyle = {...AB, fontSize:10, padding:"2px 7px"};
                return (<React.Fragment>
                <PR l="X"><input type="number" value={sel.x} onChange={e=>upLayer(sel.id,{x:+e.target.value})} style={NI}/></PR>
                <PR l="Y"><input type="number" value={sel.y} onChange={e=>upLayer(sel.id,{y:+e.target.value})} style={NI}/></PR>
                {(sel.type==="rect"||sel.type==="image"||sel.type==="svg"||sel.type==="ants")&&<React.Fragment><PR l="W"><input type="number" value={sel.width} onChange={e=>upLayer(sel.id,{width:+e.target.value})} style={NI}/></PR><PR l="H"><input type="number" value={sel.height} onChange={e=>upLayer(sel.id,{height:+e.target.value})} style={NI}/></PR></React.Fragment>}
                {sel.type==="circle"&&<PR l="Radius"><input type="number" value={sel.radius} onChange={e=>upLayer(sel.id,{radius:+e.target.value,width:+e.target.value*2,height:+e.target.value*2})} style={NI}/></PR>}
                <PR l="Centre">
                  <button onClick={centerX} style={btnStyle} title="Centre horizontally">↔ H</button>
                  <button onClick={centerY} style={btnStyle} title="Centre vertically">↕ V</button>
                  <button onClick={()=>{centerX();centerY();}} style={{...btnStyle,background:"#1a2a3a",borderColor:"#2a4a5a",color:"#7dd"}} title="Centre on canvas">⊕ Both</button>
                </PR>
                <PR l="Mirror">
                  <button onClick={mirrorX} style={btnStyle} title="Mirror left ↔ right, flip rotation">⇄ X</button>
                  <button onClick={mirrorY} style={btnStyle} title="Mirror top ↕ bottom, flip rotation">⇅ Y</button>
                </PR>
                <PR l="Rotation">
                  <input type="range" min={-180} max={180} value={sel.rotation||0} onChange={e=>upLayer(sel.id,{rotation:+e.target.value})} style={{flex:1}}/>
                  <input type="number" value={sel.rotation||0} min={-180} max={180} onChange={e=>upLayer(sel.id,{rotation:+e.target.value})} style={{...NI,width:44}}/>
                  <span style={{fontSize:9,color:"#555"}}>°</span>
                  {(sel.rotation||0)!==0&&<button onClick={()=>upLayer(sel.id,{rotation:0})} style={{background:"none",border:"none",color:"#555",cursor:"pointer",fontSize:9,padding:"0 2px"}} title="Reset rotation">↺</button>}
                </PR>
                <PR l="Opacity">
                  <input type="range" min={0} max={1} step={0.01} value={sel.opacity??1} onChange={e=>upLayer(sel.id,{opacity:+e.target.value})} style={{flex:1}}/>
                  <span style={{fontSize:10,color:"#888",width:32,textAlign:"right"}}>{Math.round((sel.opacity??1)*100)}%</span>
                </PR>
                </React.Fragment>);
              })()}</PS>

              {sel.type==="text"&&<PS t="Text">
                <textarea value={sel.text} onChange={e=>upLayer(sel.id,{text:e.target.value})} rows={2} style={{...NI,width:"100%",resize:"vertical",fontFamily:"inherit"}}/>
                <PR l="Font"><select value={sel.fontFamily} onChange={e=>upLayer(sel.id,{fontFamily:e.target.value})} style={{...NI,width:"100%"}}>{FONTS.map(f=><option key={f} value={f}>{f}</option>)}</select></PR>
                <PR l="Size"><input type="range" min={6} max={Math.max(100,canvasW)} value={sel.fontSize} onChange={e=>upLayer(sel.id,{fontSize:+e.target.value})} style={{flex:1}}/><span style={{fontSize:10,color:"#888",width:28,textAlign:"right"}}>{sel.fontSize}</span></PR>
                <PR l="Color"><input type="color" value={sel.color} onChange={e=>upLayer(sel.id,{color:e.target.value})} style={{width:28,height:22,border:"none",borderRadius:4,cursor:"pointer"}}/></PR>
                <PR l="Style">
                  <label style={{fontSize:11,color:"#aaa",display:"flex",alignItems:"center",gap:3,cursor:"pointer"}}><input type="checkbox" checked={sel.bold} onChange={e=>upLayer(sel.id,{bold:e.target.checked})}/><b>B</b></label>
                  <label style={{fontSize:11,color:"#aaa",display:"flex",alignItems:"center",gap:3,cursor:"pointer"}}><input type="checkbox" checked={sel.italic} onChange={e=>upLayer(sel.id,{italic:e.target.checked})}/><i>I</i></label>
                  <label style={{fontSize:11,color:"#aaa",display:"flex",alignItems:"center",gap:3,cursor:"pointer"}}><input type="checkbox" checked={sel.shadow} onChange={e=>upLayer(sel.id,{shadow:e.target.checked})}/>S</label>
                </PR>
                <PR l="Align">{["left","center","right"].map(a=><button key={a} onClick={()=>upLayer(sel.id,{align:a})} style={{...AB,padding:"2px 8px",background:sel.align===a?"#e94560":"#1e1e2e",color:sel.align===a?"#fff":"#aaa"}}>{a==="left"?"◀":a==="center"?"●":"▶"}</button>)}</PR>
                <PR l="Stroke"><input type="checkbox" checked={sel.stroke} onChange={e=>upLayer(sel.id,{stroke:e.target.checked})}/>{sel.stroke&&<React.Fragment><input type="color" value={sel.strokeColor} onChange={e=>upLayer(sel.id,{strokeColor:e.target.value})} style={{width:22,height:20,border:"none",borderRadius:3,cursor:"pointer"}}/><input type="number" value={sel.strokeWidth} min={1} max={10} onChange={e=>upLayer(sel.id,{strokeWidth:+e.target.value})} style={{...NI,width:36}}/></React.Fragment>}</PR>
              </PS>}

              {sel.type==="emoji"&&<PS t="Emoji">
                <PR l="Size"><input type="range" min={8} max={Math.max(100,canvasW)} value={sel.fontSize} onChange={e=>upLayer(sel.id,{fontSize:+e.target.value,width:+e.target.value,height:+e.target.value})} style={{flex:1}}/><span style={{fontSize:10,color:"#888",width:28,textAlign:"right"}}>{sel.fontSize}</span></PR>
                <div style={{display:"grid",gridTemplateColumns:"repeat(8,1fr)",gap:2,marginTop:6}}>{EMOJIS.map(em=><button key={em} onClick={()=>upLayer(sel.id,{text:em})} style={{fontSize:14,background:sel.text===em?"#2a2a3e":"none",border:"none",cursor:"pointer",padding:2,borderRadius:4}}>{em}</button>)}</div>
              </PS>}

              {sel.type==="svg"&&<PS t="SVG Icon">
                <PR l="Icon">
                  <div style={{display:"flex",flexDirection:"column",gap:4,width:"100%"}}>
                    <div style={{display:"flex",gap:3,flexWrap:"wrap"}}>
                      {SVG_CATS.map(cat=><button key={cat} onClick={()=>setSvgCat(cat)} style={{padding:"2px 6px",fontSize:9,borderRadius:4,background:svgCat===cat?"#e94560":"#1e1e2e",color:svgCat===cat?"#fff":"#aaa",border:"1px solid #2a2a3e",cursor:"pointer"}}>{cat}</button>)}
                    </div>
                    <div style={{display:"grid",gridTemplateColumns:"repeat(5,1fr)",gap:2,maxHeight:120,overflowY:"auto",background:"#1a1a28",borderRadius:4,padding:4}}>
                      {SVG_ICONS.filter(i=>i.cat===svgCat).map(icon=><button key={icon.id} onClick={()=>upLayer(sel.id,{iconId:icon.id})} title={icon.label} style={{background:sel.iconId===icon.id?"#2a2a4e":"#1e1e2e",border:sel.iconId===icon.id?"1px solid #e94560":"1px solid #2a2a3e",borderRadius:4,cursor:"pointer",padding:3,display:"flex",alignItems:"center",justifyContent:"center"}} onMouseOver={ev=>ev.currentTarget.style.background=sel.iconId===icon.id?"#2a2a4e":"#252535"} onMouseOut={ev=>ev.currentTarget.style.background=sel.iconId===icon.id?"#2a2a4e":"#1e1e2e"}>
                        <SvgIconPreview icon={icon} size={24}/>
                      </button>)}
                    </div>
                  </div>
                </PR>
                <PR l="Color"><input type="color" value={sel.color} onChange={e=>upLayer(sel.id,{color:e.target.value})} style={{width:28,height:22,border:"none",borderRadius:4,cursor:"pointer"}}/></PR>
                <PR l="W"><input type="number" value={sel.width} onChange={e=>upLayer(sel.id,{width:+e.target.value})} style={NI}/></PR>
                <PR l="H"><input type="number" value={sel.height} onChange={e=>upLayer(sel.id,{height:+e.target.value})} style={NI}/></PR>
                <PR l="Stroke"><input type="checkbox" checked={sel.stroke} onChange={e=>upLayer(sel.id,{stroke:e.target.checked})}/>{sel.stroke&&<React.Fragment><input type="color" value={sel.strokeColor} onChange={e=>upLayer(sel.id,{strokeColor:e.target.value})} style={{width:22,height:20,border:"none",borderRadius:3,cursor:"pointer"}}/><input type="number" value={sel.strokeWidth} min={1} max={20} onChange={e=>upLayer(sel.id,{strokeWidth:+e.target.value})} style={{...NI,width:36}}/></React.Fragment>}</PR>
              </PS>}

              {sel.type==="ants"&&<PS t="Marching Ants">
                <PR l="Ant style"><select value={sel.antShape||"rect"} onChange={e=>upLayer(sel.id,{antShape:e.target.value})} style={{...NI,width:"100%"}}>
                  <option value="rect">Rectangles (dashes)</option>
                  <option value="square">Squares</option>
                  <option value="circle">Circles (dots)</option>
                </select></PR>
                {(sel.antShape||"rect")==="rect"&&<React.Fragment>
                  <PR l="Rounded"><input type="checkbox" checked={!!sel.antRounded} onChange={e=>upLayer(sel.id,{antRounded:e.target.checked})}/></PR>
                  <PR l="Length"><input type="range" min={2} max={60} value={sel.antLen??10} onChange={e=>upLayer(sel.id,{antLen:+e.target.value})} style={{flex:1}}/><span style={{fontSize:10,color:"#888",width:28,textAlign:"right"}}>{sel.antLen??10}</span></PR>
                </React.Fragment>}
                <PR l="Size"><input type="range" min={1} max={24} value={sel.antSize||4} onChange={e=>upLayer(sel.id,{antSize:+e.target.value})} style={{flex:1}}/><span style={{fontSize:10,color:"#888",width:28,textAlign:"right"}}>{sel.antSize||4}</span></PR>
                <PR l="Gap"><input type="range" min={1} max={60} value={sel.antGap??8} onChange={e=>upLayer(sel.id,{antGap:+e.target.value})} style={{flex:1}}/><span style={{fontSize:10,color:"#888",width:28,textAlign:"right"}}>{sel.antGap??8}</span></PR>
                <PR l="Speed"><input type="range" min={0} max={200} step={5} value={sel.antSpeed??30} onChange={e=>upLayer(sel.id,{antSpeed:+e.target.value})} style={{flex:1}}/><span style={{fontSize:10,color:"#888",width:38,textAlign:"right"}}>{sel.antSpeed??30}px/s</span></PR>
                {(()=>{const sz=Math.max(1,sel.antSize||4),gap=Math.max(1,sel.antGap??8);const period=(sel.antShape||"rect")==="circle"?0.01+gap+sz:(sel.antShape==="square"?sz+gap:Math.max(1,sel.antLen??10)+gap);const sp=sel.antSpeed??30;if(!(sp>0)||!(totalDur>0))return null;const eff=Math.max(1,Math.round(sp*totalDur/period))*period/totalDur;return <div style={{fontSize:9,color:"#555",textAlign:"right",marginTop:-2}}>runs at {eff.toFixed(1)}px/s so the loop wraps seamlessly</div>;})()}
                <PR l="Direction">{[{v:"cw",l:"↻ CW"},{v:"ccw",l:"↺ CCW"}].map(d=><button key={d.v} onClick={()=>upLayer(sel.id,{antDir:d.v})} style={{...AB,padding:"2px 8px",background:(sel.antDir||"cw")===d.v?"#e94560":"#1e1e2e",color:(sel.antDir||"cw")===d.v?"#fff":"#aaa"}}>{d.l}</button>)}</PR>
                <PR l="Color"><input type="color" value={sel.color} onChange={e=>upLayer(sel.id,{color:e.target.value})} style={{width:28,height:22,border:"none",borderRadius:4,cursor:"pointer"}}/></PR>
                <PR l="Alpha"><input type="range" min={0} max={1} step={0.01} value={sel.antAlpha??1} onChange={e=>upLayer(sel.id,{antAlpha:+e.target.value})} style={{flex:1}}/><span style={{fontSize:10,color:"#888",width:32,textAlign:"right"}}>{Math.round((sel.antAlpha??1)*100)}%</span></PR>
                <PR l="Corners"><input type="range" min={0} max={Math.round(Math.min(sel.width,sel.height)/2)} value={sel.radius||0} onChange={e=>upLayer(sel.id,{radius:+e.target.value})} style={{flex:1}}/><span style={{fontSize:10,color:"#888",width:20,textAlign:"right"}}>{sel.radius||0}</span></PR>
              </PS>}

              {(sel.type==="rect"||sel.type==="circle")&&<PS t="Appearance">
                <PR l="Fill"><input type="color" value={sel.color} onChange={e=>upLayer(sel.id,{color:e.target.value})} style={{width:28,height:22,border:"none",borderRadius:4,cursor:"pointer"}}/></PR>
                {sel.type==="rect"&&<PR l="Radius"><input type="range" min={0} max={Math.round(Math.min(sel.width,sel.height)/2)} value={sel.radius||0} onChange={e=>upLayer(sel.id,{radius:+e.target.value})} style={{flex:1}}/><span style={{fontSize:10,color:"#888",width:20,textAlign:"right"}}>{sel.radius||0}</span></PR>}
                <PR l="Stroke"><input type="checkbox" checked={sel.stroke} onChange={e=>upLayer(sel.id,{stroke:e.target.checked})}/>{sel.stroke&&<React.Fragment><input type="color" value={sel.strokeColor} onChange={e=>upLayer(sel.id,{strokeColor:e.target.value})} style={{width:22,height:20,border:"none",borderRadius:3,cursor:"pointer"}}/><input type="number" value={sel.strokeWidth} min={1} max={10} onChange={e=>upLayer(sel.id,{strokeWidth:+e.target.value})} style={{...NI,width:36}}/></React.Fragment>}</PR>
              </PS>}

              {/* ANIMATION CHAIN */}
              <PS t="Animation Chain">
                <PR l="Start at"><input type="range" min={0} max={totalDur} step={0.05} value={sel.animStartDelay||0} onChange={e=>upLayer(sel.id,{animStartDelay:+e.target.value})} style={{flex:1}}/><span style={{fontSize:10,color:"#888",width:30,textAlign:"right"}}>{(sel.animStartDelay||0).toFixed(1)}s</span></PR>
                <div style={{display:"flex",flexDirection:"column",gap:3,marginTop:6}}>
                  {!selAnims.length&&<div style={{fontSize:11,color:"#555",textAlign:"center",padding:8}}>No animations. Add one below.</div>}
                  {selAnims.map((a,i)=>(
                    <div key={a.id} onClick={()=>setSelAnimIdx(i)} style={{display:"flex",alignItems:"center",gap:4,padding:"4px 6px",borderRadius:5,cursor:"pointer",background:selAnimIdx===i?"#1e1e32":"#161620",border:selAnimIdx===i?`1px solid ${AC[a.type]||"#444"}`:"1px solid #1e1e2e"}}>
                      <span style={{fontSize:9,fontWeight:700,color:"#fff",width:14,textAlign:"center",flexShrink:0,background:AC[a.type]||"#666",borderRadius:3,padding:"1px 0"}}>{i+1}</span>
                      <span style={{fontSize:10,flex:1,color:"#ccc",overflow:"hidden",whiteSpace:"nowrap",textOverflow:"ellipsis"}}>{ANIM_TYPES.find(x=>x.id===a.type)?.label||a.type}</span>
                      <span style={{fontSize:9,color:"#666"}}>{a.duration.toFixed(1)}s</span>
                      <button onClick={e=>{e.stopPropagation();mvAnim(sel.id,i,-1);}} style={TB} disabled={i===0}>↑</button>
                      <button onClick={e=>{e.stopPropagation();mvAnim(sel.id,i,1);}} style={TB} disabled={i===selAnims.length-1}>↓</button>
                      <button onClick={e=>{e.stopPropagation();rmAnim(sel.id,i);}} style={{...TB,color:"#e94560"}}>✕</button>
                    </div>
                  ))}
                </div>
                <div style={{marginTop:6,display:"flex",gap:4}}>
                  <select id="addAnimSel" style={{...NI,flex:1}}>{ANIM_TYPES.map(a=><option key={a.id} value={a.id}>{a.label}</option>)}</select>
                  <button onClick={()=>{addAnim(sel.id,document.getElementById("addAnimSel").value);}} style={{...AB,background:"#1a3a2a",color:"#4ade80",borderColor:"#2a5a3a"}}>+ Add</button>
                </div>
                <div style={{marginTop:6}}><div style={{fontSize:9,color:"#555",marginBottom:3}}>Quick presets:</div>
                  <div style={{display:"flex",gap:3,flexWrap:"wrap"}}>
                    {PRESETS_ANIM.map(p=><button key={p.label} onClick={()=>{upLayer(sel.id,{animations:p.steps.map(s=>({...makeAnimStep(s.type),duration:s.d}))});setSelAnimIdx(0);}} style={{...AB,fontSize:9,padding:"2px 6px"}}>{p.label}</button>)}
                  </div>
                </div>
              </PS>

              {selAnim&&<PS t={`Step ${selAnimIdx+1}: ${ANIM_TYPES.find(a=>a.id===selAnim.type)?.label||selAnim.type}`}>
                <PR l="Type"><select value={selAnim.type} onChange={e=>{const newType=e.target.value;upAnim(sel.id,selAnimIdx,{type:newType,...(ANIM_PARAM_DEFAULTS[newType]||{})});}} style={{...NI,width:"100%"}}>{ANIM_TYPES.map(a=><option key={a.id} value={a.id}>{a.label}</option>)}</select></PR>
                <PR l="Duration"><input type="range" min={0.05} max={5} step={0.05} value={selAnim.duration} onChange={e=>upAnim(sel.id,selAnimIdx,{duration:+e.target.value})} style={{flex:1}}/><span style={{fontSize:10,color:"#888",width:32,textAlign:"right"}}>{selAnim.duration.toFixed(2)}s</span></PR>
                <PR l="Easing"><select value={selAnim.easing||"easeOut"} onChange={e=>upAnim(sel.id,selAnimIdx,{easing:e.target.value})} style={{...NI,width:"100%"}}>{EASING_OPTIONS.map(o=><option key={o.id} value={o.id}>{o.label}</option>)}</select></PR>
                {/* Wiggle params */}
                {selAnim.type==="wiggle"&&<PR l="Amount"><input type="range" min={1} max={90} value={selAnim.wiggleAmount??15} onChange={e=>upAnim(sel.id,selAnimIdx,{wiggleAmount:+e.target.value})} style={{flex:1}}/><input type="number" value={selAnim.wiggleAmount??15} min={1} max={90} onChange={e=>upAnim(sel.id,selAnimIdx,{wiggleAmount:+e.target.value})} style={{...NI,width:46}}/><span style={{fontSize:9,color:"#555"}}>°</span></PR>}
                {/* Move params */}
                {(selAnim.type==="move"||selAnim.type==="moveScale")&&<React.Fragment>
                  <PR l="Move X"><input type="range" min={-300} max={300} value={selAnim.moveX||0} onChange={e=>upAnim(sel.id,selAnimIdx,{moveX:+e.target.value})} style={{flex:1}}/><input type="number" value={selAnim.moveX||0} onChange={e=>upAnim(sel.id,selAnimIdx,{moveX:+e.target.value})} style={{...NI,width:46}}/><span style={{fontSize:9,color:"#555"}}>px</span></PR>
                  <PR l="Move Y"><input type="range" min={-300} max={300} value={selAnim.moveY||0} onChange={e=>upAnim(sel.id,selAnimIdx,{moveY:+e.target.value})} style={{flex:1}}/><input type="number" value={selAnim.moveY||0} onChange={e=>upAnim(sel.id,selAnimIdx,{moveY:+e.target.value})} style={{...NI,width:46}}/><span style={{fontSize:9,color:"#555"}}>px</span></PR>
                </React.Fragment>}
                {/* Scale params */}
                {(selAnim.type==="animScale"||selAnim.type==="moveScale"||selAnim.type==="rotateScale")&&<React.Fragment>
                  <PR l="Scale From"><input type="range" min={0} max={4} step={0.05} value={selAnim.scaleFrom??1} onChange={e=>upAnim(sel.id,selAnimIdx,{scaleFrom:+e.target.value})} style={{flex:1}}/><span style={{fontSize:10,color:"#888",width:32,textAlign:"right"}}>{(selAnim.scaleFrom??1).toFixed(2)}×</span></PR>
                  <PR l="Scale To"><input type="range" min={0} max={4} step={0.05} value={selAnim.scaleTo??1.5} onChange={e=>upAnim(sel.id,selAnimIdx,{scaleTo:+e.target.value})} style={{flex:1}}/><span style={{fontSize:10,color:"#888",width:32,textAlign:"right"}}>{(selAnim.scaleTo??1.5).toFixed(2)}×</span></PR>
                </React.Fragment>}
                {/* Rotate params */}
                {(selAnim.type==="animRotate"||selAnim.type==="rotateScale")&&<React.Fragment>
                  <PR l="Rot From"><input type="range" min={-720} max={720} value={selAnim.rotFrom??0} onChange={e=>upAnim(sel.id,selAnimIdx,{rotFrom:+e.target.value})} style={{flex:1}}/><input type="number" value={selAnim.rotFrom??0} onChange={e=>upAnim(sel.id,selAnimIdx,{rotFrom:+e.target.value})} style={{...NI,width:46}}/><span style={{fontSize:9,color:"#555"}}>°</span></PR>
                  <PR l="Rot To"><input type="range" min={-720} max={720} value={selAnim.rotTo??360} onChange={e=>upAnim(sel.id,selAnimIdx,{rotTo:+e.target.value})} style={{flex:1}}/><input type="number" value={selAnim.rotTo??360} onChange={e=>upAnim(sel.id,selAnimIdx,{rotTo:+e.target.value})} style={{...NI,width:46}}/><span style={{fontSize:9,color:"#555"}}>°</span></PR>
                </React.Fragment>}
              </PS>}

              <PS t="Layer Actions">
                <div style={{display:"flex",gap:4,flexWrap:"wrap"}}>
                  <button onClick={()=>mvLayer(sel.id,-1)} style={AB}>↓ Back</button>
                  <button onClick={()=>mvLayer(sel.id,1)} style={AB}>↑ Front</button>
                  <button onClick={()=>dupeLayer(sel.id)} style={AB}>⧉ Dupe</button>
                  <button onClick={()=>delLayer(sel.id)} style={{...AB,background:"#3a1020",color:"#e94560",borderColor:"#5a1530"}}>✕ Delete</button>
                </div>
              </PS>
            </React.Fragment>
          )}
        </div>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
